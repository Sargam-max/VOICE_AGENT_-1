services:
  # Option 1: Unified Service (recommended for quick deployments & single servers)
  voice-app:
    build: .
    container_name: livekit-voice-assistant
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Option 2: If you prefer decoupled scaling, uncomment below:
